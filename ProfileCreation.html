    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const profileId = getUrlParameter('profileId');
            if (profileId) {
                document.getElementById('profileAction').innerText = 'Edit Profile';
                loadProfileData(profileId);
            }
        });

        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function loadProfileData(profileId) {
            db.collection('profiles').doc(profileId).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('username').value = data.username || '';
                    document.getElementById('name').value = data.name || '';
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('password').value = data.password || '';
                    document.getElementById('bio').value = data.bio || '';
                    if (data.profileImageUrl) {
                        document.getElementById('profileImagePreview').src = data.profileImageUrl || 'images/defauld-profile.jpg';
                    }
                } else {
                    console.error('Profile not found.');
                }
            }).catch(error => {
                console.error('Error fetching profile data:', error);
            });
        }

        document.getElementById('createProfileForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const profileId = getUrlParameter('profileId');
            const username = document.getElementById('username').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const bio = document.getElementById('bio').value;
            const file = document.getElementById('profileImage').files[0];
            const addlink = document.getElementById('addlink').value;

            const storageRef = file ? storage.ref(`profileImages/${profileId || Date.now()}`) : null;

            let uploadPromise = Promise.resolve();
            if (file) {
                uploadPromise = storageRef.put(file).then(snapshot => snapshot.ref.getDownloadURL());
            }

            uploadPromise.then(downloadURL => {
                return db.collection('profiles').doc(profileId || Date.now().toString()).set({
                    username,
                    name,
                    email,
                    password,
                    bio,
                    addlink,
                    profileImageUrl: downloadURL || ''
                });
            }).then(() => {
                localStorage.setItem('profileCreated', 'true');
                localStorage.setItem('profileId', profileId || Date.now().toString());
                localStorage.setItem('username',username);
                alert('Profile updated successfully!');
                window.location.href = 'Profile.html?profileId=' + (profileId || Date.now().toString());
            }).catch(error => {
                console.error('Error saving profile:', error);
            });
        });
    </script>

    <script>
        // Toast notification functions
        function showToast(message, type = 'error') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">
                    ${type === 'success' ? '<i class="ri-check-line"></i>' : type === 'warning' ? '<i class="ri-alert-line"></i>' : '<i class="ri-error-warning-line"></i>'}
                </div>
                <div class="toast-message">${message}</div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            toastContainer.appendChild(toast);

            // Show the toast
            setTimeout(() => toast.classList.add('show'), 10);

            // Auto-hide after 5 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        // Username @ prefix
        const usernameInput = document.getElementById('username');
        usernameInput.addEventListener('input', function() {
            if (!usernameInput.value.startsWith('@')) {
                usernameInput.value = '@' + usernameInput.value;
            }
        });
        usernameInput.addEventListener('keydown', function(e) {
            if (usernameInput.selectionStart <= 1 && (e.key === 'Backspace' || e.key === 'Delete')) {
                e.preventDefault();
            }
        });

        // Email validation
        document.getElementById('email').addEventListener('input', function () {
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            const emailExistsError = document.getElementById('emailExistsError');

            emailError.style.display = 'none';
            emailExistsError.style.display = 'none';

            if (!emailInput.checkValidity()) {
                emailError.style.display = 'block';
                return;
            }

            const email = emailInput.value;
            db.collection('profiles').where('email', '==', email).get()
                .then((querySnapshot) => {
                    if (!querySnapshot.empty) {
                        emailExistsError.style.display = 'block';
                    }
                })
                .catch((error) => {
                    console.error('Error checking email availability:', error);
                });
        });

        // URL validation
        const urlRegex = /^(https?:\/\/)?([\w-]+\.)+[\w-]{2,}(\/[^\s]*)?$/;
        document.getElementById('addlink').addEventListener('input', function() {
            const linkInput = document.getElementById('addlink').value;
            const linkErrorMessage = document.getElementById('linkErrorMessage');

            if (linkInput === '' || urlRegex.test(linkInput)) {
                linkErrorMessage.style.display = 'none';
            } else {
                linkErrorMessage.style.display = 'block';
            }
        });

        // Profile image preview
        document.getElementById('profileImage').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profileImagePreview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Modal functions
        function openSuccessModal() {
            document.getElementById('successModal').style.display = 'block';
        }
        function closeSuccessModal() {
            document.getElementById('successModal').style.display = 'none';
        }
        function redirectToProfile() {
            const profileId = localStorage.getItem('profileId');
            window.location.href = 'Profile.html?profileId=' + profileId;
        }

        // Link device modal
        const linkDeviceModal = document.getElementById('linkDeviceModal');
        const openModalBtn = document.getElementById('openLinkDeviceModal');
        const openModalBtndown = document.getElementById('openLinkDeviceModaldown');
        const closeModalBtn = document.getElementById('closeLinkDeviceModal');

        openModalBtn.onclick = function() {
            linkDeviceModal.style.display = 'block';
        };
         openModalBtndown.onclick = function() {
            linkDeviceModal.style.display = 'block';
        };
        closeModalBtn.onclick = function() {
            linkDeviceModal.style.display = 'none';
            document.getElementById('linkStatus').innerText = '';
        };
        window.onclick = function(event) {
            if (event.target === linkDeviceModal) {
                linkDeviceModal.style.display = 'none';
                document.getElementById('linkStatus').innerText = '';
            }
        };

        document.getElementById('deviceLinkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const linkCode = document.getElementById('linkCode').value;

            db.collection('profiles').where('deviceLinkCode', '==', linkCode).get().then(snapshot => {
                if (!snapshot.empty) {
                    snapshot.forEach(doc => {
                        const profileId = doc.id;
                        localStorage.setItem('profileId', profileId);
                        window.location.href = `Profile.html?profileId=${profileId}`;
                    });
                } else {
                    document.getElementById('linkStatus').innerText = 'Incorrect code. Please try again.';
                }
            }).catch(error => {
                console.error('Error linking device:', error);
                document.getElementById('linkStatus').innerText = 'Error occurred. Please try again later.';
            });
        });

        // Pick Avatar modal
        const pickAvatarModal = document.getElementById('pickAvatarModal');
        const pickAvatarBtn = document.getElementById('pickAvatarBtn');
        const closePickAvatarModal = document.getElementById('closePickAvatarModal');

        pickAvatarBtn.onclick = function() {
            pickAvatarModal.style.display = 'block';
        };
        closePickAvatarModal.onclick = function() {
            pickAvatarModal.style.display = 'none';
        };
        window.onclick = function(event) {
            if (event.target === pickAvatarModal) {
                pickAvatarModal.style.display = 'none';
            }
        };

        // Avatar selection
        document.querySelectorAll('.avatar-option').forEach(img => {
            img.addEventListener('click', function() {
                const avatarUrl = this.getAttribute('data-url');
                document.getElementById('profileImagePreview').src = avatarUrl;
                // Clear the file input since we're using an avatar
                document.getElementById('profileImage').value = '';
                pickAvatarModal.style.display = 'none';
            });
        });

        // Consolidated form submission
        document.getElementById('createProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const profileId = getUrlParameter('profileId');
            const username = document.getElementById('username').value.trim();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const bio = document.getElementById('bio').value;
            const file = document.getElementById('profileImage').files[0];
            const addlink = document.getElementById('addlink').value;
            const avatarUrl = document.getElementById('profileImagePreview').src.startsWith('Pick Avatars/') ? document.getElementById('profileImagePreview').src : '';

            // Validations
            if (!username || !name || !email || !password) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            if (document.getElementById('emailError').style.display === 'block') {
                showToast('Please enter a valid email address.', 'error');
                return;
            }

            if (document.getElementById('emailExistsError').style.display === 'block') {
                showToast('Email already exists. Please use a different one.', 'error');
                return;
            }

            if (addlink && !urlRegex.test(addlink)) {
                showToast('Please enter a valid URL for the external link.', 'error');
                return;
            }

            // Check username uniqueness
            try {
                const usernameQuery = await db.collection('profiles').where('username', '==', username).get();
                if (!usernameQuery.empty && (!profileId || usernameQuery.docs[0].id !== profileId)) {
                    showToast('Username already exists.', 'error');
                    return;
                }
            } catch (error) {
                console.error('Error checking username:', error);
                showToast('Error checking username availability.', 'error');
                return;
            }

            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';

            try {
                let downloadURL = '';
                if (file) {
                    const storageRef = storage.ref(`profileImages/${profileId || Date.now()}`);
                    const uploadTask = storageRef.put(file);

                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed',
                            (snapshot) => {
                                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                                progressBar.style.width = progress + '%';
                            },
                            (error) => {
                                console.error('Upload error:', error);
                                reject(error);
                            },
                            () => {
                                uploadTask.snapshot.ref.getDownloadURL().then((url) => {
                                    downloadURL = url;
                                    resolve();
                                });
                            }
                        );
                    });
                } else if (avatarUrl) {
                    downloadURL = avatarUrl;
                }

                const docId = profileId || Date.now().toString();
                await db.collection('profiles').doc(docId).set({
                    username,
                    name,
                    email,
                    password,
                    bio,
                    addlink,
                    profileImageUrl: downloadURL
                });

                localStorage.setItem('profileCreated', 'true');
                localStorage.setItem('profileId', docId);
                localStorage.setItem('username', username);

                progressContainer.style.display = 'none';
                showToast('Profile saved successfully!', 'success');
                openSuccessModal();

            } catch (error) {
                console.error('Error saving profile:', error);
                progressContainer.style.display = 'none';
                showToast('Error saving profile. Please try again.', 'error');
            }
        });
    </script>
</body>
