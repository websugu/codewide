        // Function to calculate time ago
        function timeAgo(timestamp) {
            const now = new Date();
            const timePosted = new Date(timestamp);
            const seconds = Math.floor((now - timePosted) / 1000);
            
            const intervals = [
                { label: 'year', seconds: 31536000 },
                { label: 'month', seconds: 2592000 },
                { label: 'day', seconds: 86400 },
                { label: 'hour', seconds: 3600 },
                { label: 'min', seconds: 60 },
                { label: 'second', seconds: 1 }
            ];

            for (const interval of intervals) {
                const count = Math.floor(seconds / interval.seconds);
                if (count >= 1) {
                    return `${count} ${interval.label}${count > 1 ? 's' : ''} ago`;
                }
            }
            return 'Just now';
        }

// Function to redirect to the user's profile
function myprofile() {
    const profileId = localStorage.getItem('profileId');

    if (profileId) {
        // If profileId is found in localStorage, redirect to the profile page
        window.location.href = `Profile.html?profileId=${profileId}`;
    } else {
        // If profileId is not in localStorage, check Firestore
        fetchProfileFromFirestore()
            .then(fetchedProfileId => {
                if (fetchedProfileId) {
                    // Save the fetched profileId in localStorage for future use
                    localStorage.setItem('profileId', fetchedProfileId);
                    window.location.href = `Profile.html?profileId=${fetchedProfileId}`;
                } else {
                    // No profile found in Firestore, show the modal instead of alert
                    openProfileNotFoundModal();
                }
            })
            .catch(error => {
                console.error('Error fetching profile from Firestore:', error);
                alert('Error retrieving profile. Please try again later.');
            });
    }
}


// Function to fetch profileId from Firestore
function fetchProfileFromFirestore() {
    return new Promise((resolve, reject) => {
        // Assuming the user’s unique identifier (could be IP address, device info, or a saved identifier)
        const userIdentifier = getUserIdentifier(); 

        // Fetch profile from Firestore using the identifier
        db.collection('profiles')
            .where('userIdentifier', '==', userIdentifier)
            .get()
            .then(querySnapshot => {
                if (!querySnapshot.empty) {
                    // If profile exists, resolve with the profileId
                    const profileDoc = querySnapshot.docs[0];
                    resolve(profileDoc.id); // This is the profileId
                } else {
                    // No profile found
                    resolve(null);
                }
            })
            .catch(error => {
                reject(error);
            });
    });
}

// Function to generate a user identifier (could be customized)
function getUserIdentifier() {
    // Example: use a combination of browser fingerprinting or other unique device/user-based methods
    // For simplicity, we could use a random UUID stored in localStorage the first time
    let userIdentifier = localStorage.getItem('userIdentifier');
    
    if (!userIdentifier) {
        userIdentifier = generateUUID(); // Function to generate a unique identifier (UUID)
        localStorage.setItem('userIdentifier', userIdentifier);
    }
    
    return userIdentifier;
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

        // Function to like a post
        function likePost(postId, event) {
            event.stopPropagation();
            const userId = localStorage.getItem('profileId');
            if (!userId) {
                openProfileNotFoundModal();
                return;
            }
            const postRef = db.collection('posts').doc(postId);
            postRef.get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    const likes = data.likes || [];
                    const isLiked = likes.includes(userId);
                    let updatedLikes;
                    if (isLiked) {
                        // Unlike
                        updatedLikes = likes.filter(id => id !== userId);
                    } else {
                        // Like
                        updatedLikes = [...likes, userId];
                        // Create notification
                        createNotification(data.profileId, 'like', userId, postId);
                    }
                    postRef.update({ likes: updatedLikes });
                    // Update UI
                    const button = event.target.closest('button');
                    const icon = isLiked ? 'ri-heart-line' : 'ri-heart-fill';
                    button.innerHTML = `<i class="${icon}"></i> ${updatedLikes.length}`;
                }
            });
        }

        // Function to open comments
        function openComments(postId, event) {
            event.stopPropagation();
            // Fetch post data to get description and profileId
            db.collection('posts').doc(postId).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    // Fetch profile data for owner name and image
                    db.collection('profiles').doc(data.profileId).get().then(profileDoc => {
                        const profileData = profileDoc.exists ? profileDoc.data() : null;
                        const ownerName = profileData ? profileData.name : 'Unknown';
                        const ownerImage = profileData ? profileData.profileImageUrl : 'images/defauld-profile.jpg';
                        document.getElementById('commentsModalTitle').textContent = `Comments:`;
                        document.getElementById('commentsModalDescription').textContent = data.description;
                        document.getElementById('commentsModalOwnerName').textContent = ownerName;
                        document.getElementById('commentsModalOwnerImage').src = ownerImage;
                        document.getElementById('commentsModal').setAttribute('data-post-id', postId);
                        document.getElementById('commentsModal').style.display = 'block';
                        loadComments(postId);
                    }).catch(error => {
                        console.error('Error fetching profile:', error);
                    });
                }
            }).catch(error => {
                console.error('Error fetching post:', error);
            });
        }

        // Function to load comments
        function loadComments(postId) {
            const commentsList = document.getElementById('commentsList');
            commentsList.innerHTML = '';

            db.collection('posts').doc(postId).collection('comments').orderBy('timestamp', 'asc').get().then(snapshot => {
                snapshot.forEach(doc => {
                    const commentData = doc.data();
                    const commenterId = commentData.commenterId;
                    // Fetch commenter profile
                    db.collection('profiles').doc(commenterId).get().then(profileDoc => {
                        const profileData = profileDoc.data();
                        const commenterName = profileData ? profileData.name : 'Anonymous';
                        const commenterImage = profileData ? profileData.profileImageUrl : 'images/defauld-profile.jpg';
                        const commentTime = timeAgo(commentData.timestamp.toDate());

                        const commentDiv = document.createElement('div');
                        commentDiv.className = 'comment-item d-flex p-3 ';
                        commentDiv.innerHTML = `
                            <img src="${commenterImage}" alt="${commenterName}" class="rounded-circle mr-3" style="width: 40px; height: 40px;">
                            <div>
                                <h6 class="mb-0">${commenterName} <small class="text-muted">${commentTime}</small></h6>
                                <p class="mb-0">${commentData.commentText}</p>
                            </div>
                        `;
                        commentsList.appendChild(commentDiv);
                    }).catch(error => {
                        console.error('Error fetching commenter profile:', error);
                    });
                });
            }).catch(error => {
                console.error('Error loading comments:', error);
            });
        }

        // Function to submit comment
        function submitComment() {
            const postId = document.getElementById('commentsModal').getAttribute('data-post-id');
            const commentText = document.getElementById('newCommentTextarea').value.trim();
            const commenterId = localStorage.getItem('profileId');

            if (!commenterId) {
                alert('Please create a profile to comment.');
                return;
            }

            if (!commentText) {
                alert('Please enter a comment.');
                return;
            }

            // Add comment to Firestore
            db.collection('posts').doc(postId).collection('comments').add({
                commenterId: commenterId,
                commentText: commentText,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                // Update comments count
                db.collection('posts').doc(postId).get().then(doc => {
                    const data = doc.data();
                    const currentCount = data.commentsCount || 0;
                    db.collection('posts').doc(postId).update({ commentsCount: currentCount + 1 });
                });
                // Reload comments
                loadComments(postId);
                // Clear textarea
                document.getElementById('newCommentTextarea').value = '';
                // Reload posts to update count in UI
                loadPosts();
            }).catch(error => {
                console.error('Error submitting comment:', error);
                alert('Error submitting comment. Please try again.');
            });
        }

        // Function to share a post
        function sharePost(postId, event) {
            event.stopPropagation();
            if (navigator.share) {
                navigator.share({
                    title: 'Check out this post',
                    url: `${window.location.origin}/code-preview.html?postId=${postId}`
                });
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(`${window.location.origin}/code-preview.html?postId=${postId}`);
                alert('Link copied to clipboard!');
            }
        }

    function filterByTag(tag) {
    const searchQuery = document.getElementById('searchInput').value;
    
    // Display posts filtered by tag and search query
    displayAllPosts(searchQuery, tag);
    
    // Get all tag buttons and remove the 'active' class from them
    const tagButtons = document.querySelectorAll('.tag-buttons .btn');
    tagButtons.forEach(button => button.classList.remove('active'));
    
    // Find the clicked button using the tag and add the 'active' class
    const clickedButton = Array.from(tagButtons).find(button => button.innerText.toLowerCase() === tag.toLowerCase());
    if (clickedButton) {
        clickedButton.classList.add('active');
    }
}

        }, 500);
    </script>
    <script>
        // Function to set up community button based on profileId
        function setupCommunityButton() {
            const profileId = localStorage.getItem('profileId');
            const buttonSection = document.getElementById('communityButtonSection');

            if (profileId) {
                buttonSection.innerHTML = '<button class="communityButtonSection" onclick="joinCommunity()">Your are member</button>';
            } else {
                buttonSection.innerHTML = '<button class="communityButtonSection-2" onclick="redirectToProfileCreation()">Create Account to Join Community</button>';
            }
        }

        // Function to join community (placeholder)
        function joinCommunity() {
            alert('You have joined the community!');
            // Implement join logic here
        }

        // Function to load community members
        function loadCommunityMembers() {
            db.collection('profiles').limit(10).get().then(snapshot => {
                const membersAvatars = document.getElementById('membersAvatars');
                membersAvatars.innerHTML = '';

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const avatar = document.createElement('img');
                    avatar.src = data.profileImageUrl || 'images/defauld-profile.jpg';
                    avatar.alt = data.name || 'Member';
                    avatar.className = 'rounded-circle';
                    avatar.style.width = '50px';
                    avatar.style.height = '50px';
                    avatar.style.cursor = 'pointer';
                    avatar.onclick = () => openMembersModal();
                    membersAvatars.appendChild(avatar);
                });

                // Add a "View All" button or indicator
                const viewAll = document.createElement('div');
                viewAll.className = 'd-flex align-items-center justify-content-center m-1';
                viewAll.style.width = '50px';
                viewAll.style.height = '50px';
                viewAll.style.border = '2px solid';
                viewAll.style.background='rgb(250, 114, 10)';
                viewAll.style.fontWeight = '900';
                viewAll.style.borderRadius = '50%';
                viewAll.style.cursor = 'pointer';
                viewAll.innerHTML = '<i class="ri-add-large-line"></i>';
                viewAll.onclick = () => openMembersModal();
                membersAvatars.appendChild(viewAll);
            }).catch(error => {
                console.error('Error loading members:', error);
            });
        }

        // Function to open members modal
        function openMembersModal() {
            document.getElementById('membersModal').style.display = 'block';
            loadAllMembers();
        }

        // Function to close members modal
        function closeMembersModal() {
            document.getElementById('membersModal').style.display = 'none';
        }

        // Function to load all members in modal
        function loadAllMembers() {
            db.collection('profiles').get().then(snapshot => {
                const membersList = document.getElementById('membersList');
                membersList.innerHTML = '';

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const memberDiv = document.createElement('div');
                    memberDiv.className = 'd-flex align-items-center p-2 border-bottom';
                    memberDiv.innerHTML = `
                        <img src="${data.profileImageUrl || 'images/defauld-profile.jpg'}" alt="${data.name}" class="rounded-circle mr-3" style="width: 40px; height: 40px;">
                        <div>
                            <h6 class="mb-0">${data.name || 'Anonymous'}</h6>
                            <small class="text-muted">${data.bio || ''}</small>
                        </div>
                    `;
                    membersList.appendChild(memberDiv);
                });
            }).catch(error => {
                console.error('Error loading all members:', error);
            });
        }

        // Function to submit new post
        function submitNewPost() {
            const profileId = localStorage.getItem('profileId');
            if (!profileId) {
                alert('Please create a profile to post.');
                return;
            }

            const textarea = document.getElementById('newPostTextarea');
            const content = textarea.value.trim();

            if (!content) {
                alert('Please enter some content for your post.');
                return;
            }

            // Add post to Firestore
            db.collection('posts').add({
                description: content,
                profileId: profileId,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                likes: 0,
                commentsCount: 0,
                views: 0,
                tags: ['community'],
                postType: 'solution'
            }).then(() => {
                textarea.value = '';
                alert('Post submitted successfully!');
                loadPosts(); // Reload posts
            }).catch(error => {
                console.error('Error submitting post:', error);
                alert('Error submitting post. Please try again.');
            });
        }

        // Function to load posts in the new container
        async function loadPosts() {
            const postsContainer = document.getElementById('postsContainer');
            postsContainer.innerHTML = '';

            try {
                const snapshot = await db.collection('posts').orderBy('timestamp', 'desc').get();
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    // Fetch profile data
                    const profileDoc = await db.collection('profiles').doc(data.profileId).get();
                    const profileData = profileDoc.exists ? profileDoc.data() : null;
                    const ownerName = profileData ? profileData.name : 'Anonymous';
                    const ownerImage = profileData ? profileData.profileImageUrl : 'images/defauld-profile.jpg';
                    const subscribersCount = profileData && profileData.subscribers ? profileData.subscribers.length : 0;
                    const postElement = createPostElement(doc.id, data, ownerName, ownerImage, subscribersCount);
                    postsContainer.appendChild(postElement);
                }
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }

        // Function to create post element
        function createPostElement(postId, data, ownerName, ownerImage, subscribersCount) {
            const postDiv = document.createElement('div');
            postDiv.className = 'col-lg-4 col-md-6 mb-4';

            const currentUserId = localStorage.getItem('profileId');
            const isOwner = data.profileId === currentUserId;
            const timeDiff = Date.now() - data.timestamp.toDate().getTime();
            const isRecent = timeDiff < 10 * 60 * 1000; // 10 minutes
            const postedMoment = timeAgo(data.timestamp.toDate());
            const profileLink = `<a href="Profile.html?profileId=${data.profileId}" class="link-pro">${ownerName}</a>`;

            // Truncate description to 10 words
            const truncatedDesc = truncateDescription(data.description, 60);
            const showMoreBtn = data.description.split(' ').length > 10 ? `<button class="show-more-btn" onclick="openComments('${postId}', event)">Show More</button>` : '';

            let buttonsHtml = '';
            if (isOwner && isRecent) {
                buttonsHtml = `<button class="btn btn-sm btn-outline-danger me-2" onclick="deletePost('${postId}', event)">Delete</button>`;
            } else {
                buttonsHtml = `
                    <button class="btn btn-sm btn-outline-primary me-2" onclick="likePost('${postId}', event)"><i class="${(data.likes || []).includes(currentUserId) ? 'ri-heart-fill' : 'ri-heart-line'}"></i> ${(data.likes || []).length}</button>
                    <button class="btn btn-sm btn-outline-primary me-2" onclick="openComments('${postId}', event)"><i class="ri-chat-1-line"></i> ${data.commentsCount || 0}</button>
                `;
            }

            postDiv.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <div class="own-prof">
                            <div class="own-prof-1">
                                <img src="${ownerImage}" alt="Owner Image" width="43" height="43">
                                <div class="own-de">
                                    <h6 class="mb-0"><strong>${profileLink}</strong><br><span class="moment">${postedMoment}</span></h6>
                                </div>
                            </div>
                            <div class="card-text-1">
                                <p class="card-text">${truncatedDesc}</p>
                                ${showMoreBtn}
                            </div>
                        </div>
                        <div class="interaction-buttons">
                            ${buttonsHtml}
                            <button class="btn btn-sm btn-outline-primary" onclick="sharePost('${postId}', event)"><i class="ri-share-line"></i></button>
                        </div>
                    </div>
                </div>
            `;

            return postDiv;
        }

        // Function to delete post
        function deletePost(postId, event) {
            event.stopPropagation();
            if (confirm('Are you sure you want to delete this post?')) {
                db.collection('posts').doc(postId).delete().then(() => {
                    loadPosts(); // Reload posts
                }).catch(error => {
                    console.error('Error deleting post:', error);
                });
            }
        }

// Function to set profile image in navbar
function setProfileImage() {
    const profileId = localStorage.getItem('profileId');
    if (profileId) {
        // Fetch the profile data from Firestore and set the profile image
        db.collection('profiles').doc(profileId).get().then(doc => {
            if (doc.exists) {
                const profileData = doc.data();
                const profileImageUrl = profileData.profileImageUrl || 'images/defauld-profile.jpg';
                document.getElementById('profileImage').src = profileImageUrl;
            }
        }).catch(error => {
            console.error('Error fetching profile:', error);
        });
    } else {
        // Show default profile image if no profile exists
        document.getElementById('profileImage').src = 'images/defauld-profile.jpg';
    }
}

// Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            setProfileImage();
            setupCommunityButton();
            loadCommunityMembers();
            loadPosts();
        });
    </script>
