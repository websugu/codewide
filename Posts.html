        // Function to redirect to the user's profile
function myprofile() {
    const profileId = localStorage.getItem('profileId');
    
    if (profileId) {
        // If profileId is found in localStorage, fetch the profile data
        db.collection('profiles').doc(profileId).get().then(doc => {
            if (doc.exists) {

                document.getElementById('profileImage').src = profileImageUrl;

        document.getElementById('profileImage').src = 'images/defauld-profile.jpg';

        window.location.href = 'ProfileCreation.html';

    <script>
        // Function to calculate time ago
        function timeAgo(timestamp) {
            const now = new Date();
            const timePosted = new Date(timestamp);
            const seconds = Math.floor((now - timePosted) / 1000);
            
            const intervals = [
                { label: 'year', seconds: 31536000 },
                { label: 'month', seconds: 2592000 },
                { label: 'day', seconds: 86400 },
                { label: 'hour', seconds: 3600 },
                { label: 'min', seconds: 60 },
                { label: 'second', seconds: 1 }
            ];

            for (const interval of intervals) {
                const count = Math.floor(seconds / interval.seconds);
                if (count >= 1) {
                    return `${count} ${interval.label}${count > 1 ? 's' : ''} ago`;
                }
            }
            return 'Just now';
        }

// Function to redirect to the user's profile
function myprofile() {
    const profileId = localStorage.getItem('profileId');

    if (profileId) {
        // If profileId is found in localStorage, redirect to the profile page
        window.location.href = `Profile.html?profileId=${profileId}`;
    } else {
        // If profileId is not in localStorage, check Firestore
        fetchProfileFromFirestore()
            .then(fetchedProfileId => {
                if (fetchedProfileId) {
                    // Save the fetched profileId in localStorage for future use
                    localStorage.setItem('profileId', fetchedProfileId);
                    window.location.href = `Profile.html?profileId=${fetchedProfileId}`;
                } else {
                    // No profile found in Firestore, show the modal instead of alert
                    openProfileNotFoundModal();
                }
            })
            .catch(error => {
                console.error('Error fetching profile from Firestore:', error);
                alert('Error retrieving profile. Please try again later.');
            });
    }
}


// Function to fetch profileId from Firestore
function fetchProfileFromFirestore() {
    return new Promise((resolve, reject) => {
        // Assuming the user’s unique identifier (could be IP address, device info, or a saved identifier)
        const userIdentifier = getUserIdentifier(); 

        // Fetch profile from Firestore using the identifier
        db.collection('profiles')
            .where('userIdentifier', '==', userIdentifier)
            .get()
            .then(querySnapshot => {
                if (!querySnapshot.empty) {
                    // If profile exists, resolve with the profileId
                    const profileDoc = querySnapshot.docs[0];
                    resolve(profileDoc.id); // This is the profileId
                } else {
                    // No profile found
                    resolve(null);
                }
            })
            .catch(error => {
                reject(error);
            });
    });
}

// Function to generate a user identifier (could be customized)
function getUserIdentifier() {
    // Example: use a combination of browser fingerprinting or other unique device/user-based methods
    // For simplicity, we could use a random UUID stored in localStorage the first time
    let userIdentifier = localStorage.getItem('userIdentifier');
    
    if (!userIdentifier) {
        userIdentifier = generateUUID(); // Function to generate a unique identifier (UUID)
        localStorage.setItem('userIdentifier', userIdentifier);
    }
    
    return userIdentifier;
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

function formatViews(views) {
    if (views >= 1000000) {
      return (views / 1000000).toFixed(1).replace(/\.0$/, '') + 'M'; // Formats millions
    } else if (views >= 1000) {
      return (views / 1000).toFixed(1).replace(/\.0$/, '') + 'K'; // Formats thousands
    } else {
      return views; // Returns views as is if below 1,000
    }
  }

    function filterByTag(tag) {

// Function to show suggestions in the dropdown
function showSuggestions(inputValue) {
    const suggestionsList = document.getElementById("suggestionsList");

    if (inputValue.length === 0) {
        suggestionsList.style.display = "none";
        return;
    }

    // Filter postsData based on input
    const filteredData = postsData.filter(item => 
        item.username.toLowerCase().includes(inputValue.toLowerCase()) || 
        item.postTitle.toLowerCase().includes(inputValue.toLowerCase())
    );

    // If no matches, hide the dropdown
    if (filteredData.length === 0) {
        suggestionsList.style.display = "none";
        return;
    }

    // Generate list items for the dropdown
    suggestionsList.innerHTML = "";
    filteredData.forEach(item => {
        const listItem = document.createElement("li");
        listItem.textContent = `${item.username} - ${item.postTitle}`;
        listItem.onclick = function() {
            // Set the selected suggestion in the input field
            document.getElementById("searchInput").value = `${item.username} - ${item.postTitle}`;
            // You can also redirect to the post or user profile here
            suggestionsList.style.display = "none"; // Hide the dropdown
        };
        suggestionsList.appendChild(listItem);
    });

    suggestionsList.style.display = "block";
}

// Hide the dropdown when clicking outside
document.addEventListener("click", function(event) {
    const searchInput = document.getElementById("searchInput");
    const suggestionsList = document.getElementById("suggestionsList");

    if (!searchInput.contains(event.target) && !suggestionsList.contains(event.target)) {
        suggestionsList.style.display = "none";
    }
});
// Fetch posts dynamically from Firestore
function fetchPosts() {
    db.collection('posts').get().then(querySnapshot => {
        const posts = [];
        querySnapshot.forEach(doc => {
            const data = doc.data();
            posts.push({ username: data.username, title: data.title });
        });
    }).catch(error => {
        console.error('Error fetching posts:', error);
    });
}

// Call fetchPosts to populate the posts array on page load
fetchPosts();
