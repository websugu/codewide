<html lang="en">
<head>
    <!-- font-family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/x-icon" href="images/bintcode-fav - Copy.png">
    <!-- icons -->
     <link rel="stylesheet" href="Profile.html">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/SavedPosts.css">
    <title>Saved Posts</title>
    <!-- Add your CSS and JS files -->
</head>
<body class="light-theme">
    <button id="themeToggle" class="Toggle" style="border: none;background:transparent;display: none;"><i class="ri-toggle-line" style="color: rgb(40, 37, 37);"></i></button>

    <div class="saved-body">
        <div class="saved-body">
            <h2>Saved Posts</h2>
        <div>
            <p id="savedPostsCount">0 Posts</p> <!-- This will be updated dynamically -->
        <div id="savedPostsContainer"></div>
    </div>
        </div>
    </div>
    
    

    
    
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap and Firebase Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/6.0.2/firebase.js"></script>
    <!-- <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth.js"></script> -->
    <script src="auth-check.js"></script>
    <script src="firebaseConfig.js"></script>
    <script src="scripts.js"></script>
    <script>
        function loadSavedPosts() {
    const userId = localStorage.getItem('profileId'); // The logged-in user's ID
    const savedPostsContainer = document.getElementById('savedPostsContainer');
    savedPostsContainer.innerHTML = ''; // Clear any previous content
    const savedPostsCountElement = document.getElementById('savedPostsCount');
    
    // Function to truncate the description to a specified length
    function truncateDescription(description, maxLength) {
        if (description.length > maxLength) {
            return description.substring(0, maxLength) + '...'; // Add ellipsis if text is truncated
        }
        return description;
    }

    // Fetch saved posts
    db.collection('users').doc(userId).collection('savedPosts').orderBy('savedAt', 'desc').get()
        .then((querySnapshot) => {
            const totalSavedPosts = querySnapshot.size; // Get total number of saved posts
            savedPostsCountElement.innerText = `${totalSavedPosts} Posts`; // Display the total count
            
            // Check if there are no saved posts
            if (totalSavedPosts === 0) {
                savedPostsContainer.innerHTML = '<p>No saved posts yet.</p>'; // Display message
                return; // Exit the function
            }

            // Loop through each saved post
            querySnapshot.forEach((doc) => {
                const savedPostId = doc.data().postId;

                // Fetch the actual post details
                db.collection('posts').doc(savedPostId).get().then((postDoc) => {
                    if (postDoc.exists) {
                        const postData = postDoc.data();
                        const truncatedDescription = truncateDescription(postData.description, 40); // Limit to 100 characters

                        const postElement = `
                        <div onclick="openCodePreview('${savedPostId}')"  class="saved-post">
                            <div>
                                <img src="${postData.postImageUrl}" alt="Post Image" height="200">
                                <p>${truncatedDescription}</p>
                            </div>
                        </div>
                        `;
                        savedPostsContainer.innerHTML += postElement; // Add the post to the container
                    }
                });
            });
        }).catch((error) => {
            console.error('Error loading saved posts:', error);
        });
}

// Call this function when the SavedPosts page is loaded
loadSavedPosts();

    </script>
    <script>
         function openCodePreview(postId) {
    // Redirect to the CodePreview page with the postId in the URL
    window.location.href = `code-preview.html?postId=${postId}`;
}
    </script>
</body>
</html>
